# E1: State-level Structural Diagnosis（PUG: SPAR + CLEVR val）
seeds: [0, 1, 2]
bootstrap:
  n_boot: 1000
  ci: 0.95

sampling:
  target_per_cell: 2000     # 每个 dataset × factor 的目标样本数（方案 §31：至少 1000）
  per_scene_cap: 1          # 每张图每类 factor 最多取 1 条样本

clevr:
  scene_file: scenes/CLEVR_val_scenes.json
  image_dir: images/val
  factors: [object, color, size, material, relation, binding]

spar:
  factors: [scene, position, attribute, relation]
  # 以下两项是协议的固定描述（入口校验，不支持用配置关闭——四轮补充 B：
  # 此前改这两项不会产生任何消融效果，现改为显式拒绝）：
  # - position/attribute/relation 固定为双对象任务：两侧动物均非 blank（R3）；
  # - 双对象同种动物场景固定整体过滤（P1-2：否则正负文本可能相同或同时为真）。
  two_object_only: [position, attribute, relation]
  attribute_require_diff_texture: true               # tex1 != tex2 才有效
  same_animal_filter: true

# PUG:SPAR 官方协议（facebookresearch/PUG run_eval_vlms_on_spar.py 的 CLIP 路径）。
# 与上方自建 2AFC 并行输出；scripts/run_e1_spar_official.py 单独运行。
spar_official:
  per_world: false     # true 时额外输出逐 world 的结果（官方脚本默认循环全部 world）
  max_per_task: 2000   # 查询图片抽样上限（seeds[0]；检索候选池仍取完整子集，bg/no-bg
                       # 复用同一组查询图片；设 null 恢复官方全量子集；scene 保留官方 10 行）
